services:
    # PostgreSQL - the only backing service the API needs
    postgres:
        image: postgres:18
        container_name: clause-postgres
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: clause
            POSTGRES_PASSWORD: clause
            POSTGRES_DB: clause
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U clause -d clause"]
            interval: 5s
            timeout: 5s
            retries: 10

    # Development Environment
    api-dev:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: development # Points to the development stage in Dockerfile
        container_name: clause-api-dev
        ports:
            - "3000:3000"
        env_file:
            - apps/api/.env
        # We use a profile so this only runs when explicitly requested
        profiles:
            - dev

    # Production Environment
    api-prod:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: production # Points to the production stage in Dockerfile
        container_name: clause-api-prod
        ports:
            - "3000:3000"
        env_file:
            - apps/api/.env
        # We use a profile so this only runs when explicitly requested
        profiles:
            - prod

volumes:
    postgres-data:
